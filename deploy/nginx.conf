# =============================================================================
#  Coder Sean · 个人知识库智能体 —— Nginx 配置
#
#  作用：① 托管前端静态资源（frontend 打包产物 dist）
#        ② 反向代理后端 Spring Boot（默认 127.0.0.1:8080），前端只用相对路径
#           /chat、/chat/title、/admin/*，所以这里按前缀转发即可
#
#  准备前端产物：
#      cd frontend && npm install && npm run build     # 产出 frontend/dist
#      mkdir -p /usr/local/ai-project
#      cp -r frontend/dist /usr/local/ai-project/dist
#      chmod -R 755 /usr/local/ai-project/dist          # 保证 nginx 工作进程能读
#
#  使用方式：
#      整体替换 /etc/nginx/nginx.conf（本文件自带完整 http 块）
#      或者只把下面 server { ... } 整块拷进你已有的 http 块里
#
#  ⚠️ 若这台服务器上已经有别的站点（例如另一个 listen 80 + server_name localhost），
#     两个 server 块会冲突（先匹配到的生效）。请给两边配不同的域名：
#         server_name knowledge.yourdomain.com;    # 本项目
#         server_name shop.yourdomain.com;         # 已有站点
#     或者把本项目改成 listen 8081; 之类的独立端口。
#
#  校验并生效：
#      nginx -t && systemctl reload nginx
# =============================================================================

user  nobody;
worker_processes  auto;              # 单核小机器写 1 即可

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # ---- 静态资源压缩（Vue 打包后的 js/css 能压掉七成左右）----
    # 注意：gzip_proxied 保持 off，且 gzip_types 里绝不要加 text/event-stream，
    #       否则 SSE 会被 gzip 缓冲，流式输出变成"憋到最后一次性吐出来"。
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_proxied      off;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/javascript application/xml
                      image/svg+xml;

    # 本项目没有文件上传接口，请求体都很小（聊天 JSON），给个宽松上限即可
    client_max_body_size 10m;

    # ---- 后端地址：nginx 与后端同机，务必保持 127.0.0.1，不要暴露到公网 ----
    upstream knowledge_agent {
        server 127.0.0.1:8080;
        keepalive 16;
    }

    server {
        listen       80;
        server_name  localhost;                   # 有域名就换成你的域名

        # 前端静态资源目录（对应 npm run build 产出的 dist）
        root   /usr/local/ai-project/dist;
        index  index.html;

        # =====================================================================
        # 1) 对话接口：SSE 流式（POST /chat 与 POST /chat/title）
        #
        #    Spring 返回 text/event-stream，前端用 fetch + ReadableStream 逐段读。
        #    nginx 默认会缓冲 upstream 响应，那样"打字机效果"就没了，
        #    所以这里必须关缓冲；深度思考模式单轮可能跑很久，读超时也要给足。
        # =====================================================================
        location ~ ^/chat(/|$) {
            proxy_pass http://knowledge_agent;
            proxy_http_version 1.1;

            # SSE 关键配置
            proxy_buffering off;                  # 关闭响应缓冲（核心）
            proxy_cache     off;
            proxy_set_header Connection '';        # 配合 1.1 走长连接

            proxy_connect_timeout 60s;
            proxy_send_timeout    3600s;
            proxy_read_timeout    3600s;           # 默认 60s，深度思考很容易超

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =====================================================================
        # 2) 管理接口：/admin/compile、/admin/skill/reload、/admin/reindex、
        #    /admin/status、/admin/search
        #
        #    compile 会逐篇笔记调用大模型、reindex 要跑一遍向量化，都是分钟级
        #    慢请求，超时同样要给足，否则前端会收到 504。
        #
        #    ⚠️ 这些接口目前没有任何鉴权，公网可访问时建议按下面的注释加上
        #       IP 白名单或 Basic Auth。
        # =====================================================================
        location ~ ^/admin(/|$) {
            proxy_pass http://knowledge_agent;
            proxy_http_version 1.1;
            proxy_set_header Connection '';

            proxy_connect_timeout 60s;
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 只允许内网访问，按需解除注释（改成你自己的网段）：
            # allow 127.0.0.1;
            # allow 192.168.1.0/24;
            # deny  all;
        }

        # =====================================================================
        # 3) 前端静态资源
        # =====================================================================
        # Vite 产物文件名带内容 hash，可以放心长缓存
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # index.html 绝不能缓存，否则发版后用户还拿旧页面去请求已删除的 hash 资源
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Pragma "no-cache";
        }

        # SPA 兜底：刷新或直接访问任意前端路由都回落到 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 隐藏文件与备份文件一律拒绝
        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
