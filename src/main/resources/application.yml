spring:
  config:
    import: optional:file:./application-secret.yml
  application:
    name: personal-knowledge-agent
  ai:
    openai:
      # Chat：DeepSeek（OpenAI 兼容接口）
      # api-key 来源（任选其一，优先级从高到低）：
      #   1) 环境变量 SPRING_AI_OPENAI_API_KEY=sk-xxx
      #   2) 启动参数 --spring.ai.openai.api-key=sk-xxx
      #   3) 外部文件 ./application-secret.yml（见上方 spring.config.import；
      #      注意：该文件不会打进 jar，服务器上需手动放置）
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
      # Embedding：Ollama（OpenAI 兼容接口，base-url 不要带 /v1）
      embedding:
        base-url: http://localhost:11434
        api-key: ollama
        options:
          model: nomic-embed-text

# 对话双模式所用模型
chat:
  quick-model: deepseek-chat          # 快点回答我很急（流式对话模式）
  think-model: deepseek-reasoner      # 容我思考片刻（深度思考）

# 个人知识库配置
knowledge:
  raw-notes-dir: data/raw-notes
  wiki-dir: data/wiki
  skill-dir: skill                          # Skill 包目录（SKILL.md + references/），对话人设来源
