spring:
  config:
    # api-key 来源（优先级从高到低）：
    #   1) 环境变量 SPRING_AI_OPENAI_API_KEY=sk-xxx
    #   2) 启动参数 --spring.ai.openai.api-key=sk-xxx
    #   3) 工作目录下的 ./application-secret.yml（服务器上临时替换密钥用）
    #   4) jar 内置的 classpath:/application-secret.yml（打包时放在 src/main/resources 下，
    #      让 jar 能做到"零配置 java -jar 直接跑"；该文件已被 .gitignore 忽略，不会进仓库）
    import: optional:file:./application-secret.yml,optional:classpath:/application-secret.yml
  application:
    name: personal-knowledge-agent
  ai:
    model:
      # Embedding 提供方，由 knowledge.embedding.provider 单点控制：
      #   onnx   -> jar 内置本地 ONNX 模型（进程内推理、完全离线；要求系统 glibc ≥ 2.17）
      #   openai -> 云端 OpenAI 兼容 Embedding（CentOS 7 等老系统用这个，需另配 key）
      # 这里不要直接写死，否则会和下面 knowledge.embedding.provider 不一致
      embedding: ${knowledge.embedding.provider:onnx}
    openai:
      # Chat：DeepSeek（OpenAI 兼容接口）
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
      # 仅当 provider=openai 时生效；任何 OpenAI 兼容的 Embedding 服务都可以
      embedding:
        base-url: ${knowledge.embedding.base-url:https://api.siliconflow.cn}
        api-key: ${knowledge.embedding.api-key:}
        options:
          model: ${knowledge.embedding.model:BAAI/bge-m3}

# 对话双模式所用模型
chat:
  quick-model: deepseek-chat          # 快点回答我很急（流式对话模式）
  think-model: deepseek-reasoner      # 容我思考片刻（深度思考）

# 个人知识库配置
knowledge:
  raw-notes-dir: data/raw-notes
  wiki-dir: data/wiki
  skill-dir: skill                          # Skill 包目录（SKILL.md + references/），对话人设来源

  # 向量库文件：存在就直接加载（跳过启动时向量化）→ 否则回退 jar 内置 → 最后才现算
  # 打包进 jar 的内置副本位于 classpath:/vectorstore/vectorstore.json
  # 注意：换 Embedding 模型后维度会变，程序检测到不匹配会自动忽略旧向量库并重新向量化
  vector-store-file: data/vectorstore/vectorstore.json

  embedding:
    # onnx = 本地模型（默认，离线）；openai = 云端 OpenAI 兼容接口
    # 服务器上也可以用启动参数临时切换，无需重新打包：
    #   java -jar app.jar --knowledge.embedding.provider=openai \
    #                     --knowledge.embedding.api-key=sk-xxx
    provider: onnx

    # ---- provider=openai 时使用（示例：硅基流动 BAAI/bge-m3，1024 维）----
    base-url: https://api.siliconflow.cn
    api-key: ""                             # 建议放 application-secret.yml 里，别提交
    model: BAAI/bge-m3

    # ---- provider=onnx 时使用 ----
    # 把 bge-small-zh-v1.5-q.onnx 与 bge-small-zh-v1.5-q-tokenizer.json 放进该目录，
    # 即可覆盖 jar 内置模型（换模型无需重新打包）
    dir: data/onnx
    # jar 内置模型解压出来的缓存目录，留空则用 ${java.io.tmpdir}/personal-knowledge-agent/onnx
    cache-dir: ""
